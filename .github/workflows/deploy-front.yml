name: Deploy Front na Vercel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O vercel.json tem um placeholder; o endereço real do back vem de um secret
      # (ex.: API_URL = http://54.12.34.56:8080). Assim o IP nunca fica no repositório.
      - name: Apontar o proxy /api para o back (AWS)
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          test -n "$API_URL" || { echo "::error::Falta o secret API_URL"; exit 1; }
          sed -i "s|API_URL_PLACEHOLDER|${API_URL%/}|g" vercel.json
          cat vercel.json

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Puxar configuração do projeto na Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        # Opcionais: se não existirem, o front usa os padrões de src/config.js
        env:
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
